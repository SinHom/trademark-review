# 商标审查配置
# 原则：只保留代码真正读取的配置项；未实现的选项不放进来，避免"配置骗人"。
trademark_review:
  # 审查依据版本：2019（现行有效）| 2026（2027-01-01 起施行）
  law:
    version: "2019"

  # 未指定类别时的默认值
  default_classes: [9, 35, 42]

  # 风险阈值
  risk_threshold:
    high: 0.7      # ≥0.7 判高风险
    medium: 0.4    # 0.4–0.7 判中风险

  # 审查选项
  review:
    skip_similarity_check: false   # true = 跳过在先商标检索（结论会标注"未检索"）

  # 商标数据源适配器；null = 不检索，绝不返回虚构数据
  api:
    adapter_class: null            # 例："my_package.MyAdapter"

  # AI 辅助分析（默认关闭）
  ai_analysis:
    enabled: false
    provider: "anthropic"          # anthropic | openai
    model: "claude-3-5-sonnet-20241022"
    api_key: null                  # 建议用环境变量 ANTHROPIC_API_KEY / OPENAI_API_KEY
    features:
      geographic_analysis: true    # 地名多义性判断
      distinctiveness_deep: true   # 显著性深度分析
      semantic_similarity: false   # 接口已备，尚未接入主流程
      alternative_generation: true # 生成修改建议
